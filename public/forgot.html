<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - CODEX OUTSOURCING SOLUTIONS</title>
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <img src="/images/téléchargement.png" alt="CODEX OUTSOURCING SOLUTIONS">
        </div>
        <h1>Mot de passe oublié</h1>
        <p class="sub">Entrez votre email. Si un compte existe, vous recevrez un lien de réinitialisation.</p>

        <div id="ok" class="msg ok"></div>
        <div id="err" class="msg err"></div>

        <form id="forgotForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required />
            </div>
            <button type="submit" class="btn">Envoyer</button>
        </form>

        <div class="auth-link">
            <a href="/login">Retour à la connexion</a>
        </div>
    </div>

    <script src="/js/forgot.js"></script>
</body>
</html>
