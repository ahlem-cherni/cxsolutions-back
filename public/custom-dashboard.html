<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - CODEX OUTSOURCING SOLUTIONS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .dashboard-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 60px;
            text-align: center;
            max-width: 600px;
            width: 90%;
        }
        
        .logo {
            width: 200px;
            height: auto;
            margin-bottom: 30px;
        }
        
        .welcome-title {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 300;
        }
        
        .welcome-subtitle {
            font-size: 1.2rem;
            color: #7f8c8d;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        
        .dashboard-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #e9ecef;
        }
        
        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .card-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }
        
        .card-title {
            font-size: 1.1rem;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .card-description {
            font-size: 0.9rem;
            color: #6c757d;
            line-height: 1.4;
        }
        
        .empty-state {
            color: #6c757d;
            font-style: italic;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <img src="/images/téléchargement.png" alt="CODEX OUTSOURCING SOLUTIONS" class="logo">
        
        <h1 class="welcome-title">Bienvenue</h1>
        <p class="welcome-subtitle">
            Interface d'administration CODEX OUTSOURCING SOLUTIONS
        </p>
        
        <div class="dashboard-grid">
            <div class="dashboard-card">
                <div class="card-icon">👥</div>
                <div class="card-title">Utilisateurs</div>
                <div class="card-description">Gérer les utilisateurs du système</div>
            </div>
            
            <div class="dashboard-card">
                <div class="card-icon">📰</div>
                <div class="card-title">Actualités</div>
                <div class="card-description">Gérer les news et annonces</div>
            </div>
            
            <div class="dashboard-card">
                <div class="card-icon">👨‍💼</div>
                <div class="card-title">Équipes</div>
                <div class="card-description">Gérer les équipes et membres</div>
            </div>
        </div>
        
        <div class="empty-state">
            <p>Utilisez le menu de gauche pour naviguer dans l'application</p>
        </div>
    </div>
</body>
</html>
